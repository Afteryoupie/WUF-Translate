<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="c2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#BF421F" flood-opacity="0.25" />
    </filter>
    <filter id="c2-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="#F5F3EC" />

  <!-- Audio Waveform & Headset Arc in Vermilion -->
  <g filter="url(#c2-glow)">
    <!-- Headphone / Audio Halo Arc -->
    <path d="M 62 136 
             A 72 72 0 1 1 194 136" 
          fill="none" 
          stroke="#BF421F" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Left Audio Frequency Waveform Pulse -->
    <path d="M 18 136 
             L 42 136 
             L 50 114 
             L 58 158 
             L 66 126 
             L 74 144 
             L 84 136" 
          fill="none" 
          stroke="#BF421F" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Audio Frequency Waveform Pulse -->
    <path d="M 172 136 
             L 182 144 
             L 190 126 
             L 198 158 
             L 206 114 
             L 214 136 
             L 238 136" 
          fill="none" 
          stroke="#BF421F" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Front-Facing Border Collie Head -->
  <g filter="url(#c2-shadow)">
    <!-- Dark Face & Ears Outer Silhouette (Ink #242620) -->
    <path d="M 128 198
             C 106 198, 84 186, 72 168
             C 64 156, 62 142, 60 126
             C 56 114, 52 92, 54 68
             C 56 58, 64 54, 72 60
             C 82 68, 92 84, 98 100
             C 108 94, 118 92, 128 92
             C 138 92, 148 94, 158 100
             C 164 84, 174 68, 184 60
             C 192 54, 200 58, 202 68
             C 204 92, 200 114, 196 126
             C 194 142, 192 156, 184 168
             C 172 186, 150 198, 128 198 Z" 
          fill="#242620" />

    <!-- Inner Ear Accents (Warm paper tint) -->
    <path d="M 68 76 C 72 82, 80 94, 86 104 C 80 102, 74 98, 70 90 Z" fill="#E4DEC9" />
    <path d="M 188 76 C 184 82, 176 94, 170 104 C 176 102, 182 98, 186 90 Z" fill="#E4DEC9" />

    <!-- Symmetrical White Central Blaze & Muzzle (#FFFFFF) -->
    <path d="M 128 92
             C 124 104, 121 116, 117 126
             C 112 136, 102 144, 96 154
             C 90 164, 94 176, 106 182
             C 114 186, 122 188, 128 188
             C 134 188, 142 186, 150 182
             C 162 176, 166 164, 160 154
             C 154 144, 144 136, 139 126
             C 135 116, 132 104, 128 92 Z" 
          fill="#FFFFFF" />

    <!-- Eyes (Focused, Intelligent Border Collie Gaze) -->
    <g fill="#242620">
      <!-- Left Eye -->
      <path d="M 96 130 C 102 124, 110 126, 112 132 C 110 138, 100 138, 96 130 Z" />
      <circle cx="104" cy="130" r="2" fill="#FFFFFF" />

      <!-- Right Eye -->
      <path d="M 160 130 C 154 124, 146 126, 144 132 C 146 138, 156 138, 160 130 Z" />
      <circle cx="152" cy="130" r="2" fill="#FFFFFF" />
    </g>

    <!-- Nose & Mouth -->
    <path d="M 122 154 
             C 124 151, 132 151, 134 154 
             C 136 158, 131 164, 128 164 
             C 125 164, 120 158, 122 154 Z" 
          fill="#242620" />
    <path d="M 128 164 L 128 172 M 122 170 C 125 173, 128 173, 128 172 C 128 173, 131 173, 134 170" 
          fill="none" 
          stroke="#242620" 
          stroke-width="2.5" 
          stroke-linecap="round" />
  </g>
</svg>
