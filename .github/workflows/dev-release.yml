name: Build and Update Dev Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dev-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and run tests (includes build)
        run: |
          npm run typecheck
          npm test

      - name: Package dist/wuf into ZIP
        env:
          ASSET_NAME: WUF-Translate-dev-latest.zip
        run: |
          mkdir -p dist/release
          (cd dist/wuf && zip -r -q "../release/${ASSET_NAME}" .)
          test -f "dist/release/${ASSET_NAME}"

      - name: Update rolling dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-latest
          ASSET_PATH: dist/release/WUF-Translate-dev-latest.zip
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TIME="$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S (UTC+8)')"

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          自動從 \`main\` 分支最新進度建置的開發測試版（Pre-release），正式版本請下載標記為 **Latest** 的穩定版。

          - **建置基準**：\`v${PKG_VERSION}\` @ [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - **建置時間**：${BUILD_TIME}

          ### 安裝方式
          1. 下載下方的 \`WUF-Translate-dev-latest.zip\` 並解壓縮到固定資料夾（確認資料夾內直接包含 \`manifest.json\`）。
          2. 開啟 \`chrome://extensions\` 或 \`edge://extensions\`，開啟「開發人員模式」後按「載入未封裝項目」選取該資料夾。
          3. 若原本已載入舊版，將解壓縮後的檔案覆蓋原資料夾，再於擴充功能管理頁按「重新載入」。
          EOF

          # Remove previous rolling release and tag if present (tests already passed above)
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true

          gh release create "$TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "WUF Translate 最新開發版 (${SHORT_SHA})" \
            --notes-file "$NOTES_FILE"
